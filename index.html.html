<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الشعب والمواد الدراسية - أكاديمية الشروق</title>
    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            
            /* ألوان الشعب المحصورة */
            --cs-color: #2563eb;       /* علوم حاسب - أزرق تقني */
            --cs-hover: #1d4ed8;
            --cyber-color: #991b1b;    /* أمن سيبراني - عنابي/أحمر حماية */
            --cyber-hover: #7f1d1d;
            --ai-color: #7c3aed;       /* ذكاء اصطناعي - بنفسجي */
            --ai-hover: #6d28d9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 5%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: #fff;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        /* قسم اختيار الشعب */
        .departments-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto 40px;
        }

        .dept-btn {
            padding: 25px 20px;
            border-radius: 16px;
            border: 2px solid transparent;
            cursor: pointer;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .dept-btn i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            display: block;
        }

        .dept-btn h3 {
            font-size: 1.4rem;
            font-weight: 800;
        }

        /* تخصيص ألوان الشعب */
        .dept-cs {
            background: linear-gradient(135deg, #1e3a8a, var(--cs-color));
            border-color: #3b82f6;
        }
        .dept-cs:hover, .dept-cs.active {
            background: var(--cs-hover);
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.5);
        }

        .dept-cyber {
            background: linear-gradient(135deg, #450a0a, var(--cyber-color));
            border-color: #ef4444;
        }
        .dept-cyber:hover, .dept-cyber.active {
            background: var(--cyber-hover);
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(153, 27, 27, 0.5);
        }

        .dept-ai {
            background: linear-gradient(135deg, #4c1d95, var(--ai-color));
            border-color: #a855f7;
        }
        .dept-ai:hover, .dept-ai.active {
            background: var(--ai-hover);
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
        }

        /* قسم المواد */
        .subjects-section {
            display: none;
            max-width: 1100px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease;
        }

        .section-title {
            font-size: 1.6rem;
            margin-bottom: 25px;
            padding-right: 15px;
            border-right: 5px solid var(--text-sub);
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        /* بطاقات المواد والشعارات في الخلفية */
        .subject-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .subject-card:hover, .subject-card.active {
            border-color: #64748b;
            transform: translateY(-5px);
            background-color: #334155;
        }

        .subject-card h4 {
            font-size: 1.2rem;
            font-weight: 700;
            position: relative;
            z-index: 2;
        }

        /* شعارات الخلفية المخصصة لكل مادة */
        .bg-icon {
            position: absolute;
            bottom: -15px;
            left: -15px;
            font-size: 6.5rem;
            opacity: 0.08;
            z-index: 1;
            pointer-events: none;
            color: #ffffff;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        /* منطقة إدارة ورفع الملفات */
        .files-section {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
            animation: fadeIn 0.4s ease;
        }

        .files-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .upload-box {
            background-color: var(--bg-dark);
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        .upload-box input[type="file"] {
            display: none;
        }

        .upload-btn {
            background-color: #3b82f6;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            font-weight: 700;
            margin-top: 10px;
        }

        .upload-btn:hover {
            background-color: #2563eb;
        }

        .files-list {
            display: grid;
            gap: 12px;
        }

        .file-item {
            background-color: var(--bg-dark);
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-info i {
            font-size: 1.5rem;
            color: #ef4444;
        }

        .file-actions a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            background-color: rgba(56, 189, 248, 0.1);
        }

        .file-actions a:hover {
            background-color: rgba(56, 189, 248, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>المنصة التعليمية للقسم</h1>
        <p>اختر الشعبة الدراسية للوصول إلى المواد وقاعدة الملفات</p>
    </header>

    <!-- 1. اختيار الشعبة -->
    <div class="departments-container">
        <div class="dept-btn dept-cs" onclick="selectDept('cs', 'علوم حاسب', this)">
            <i class="fas fa-laptop-code"></i>
            <h3>علوم حاسب</h3>
        </div>
        <div class="dept-btn dept-cyber" onclick="selectDept('cyber', 'أمن سيبراني', this)">
            <i class="fas fa-user-shield"></i>
            <h3>أمن سيبراني</h3>
        </div>
        <div class="dept-btn dept-ai" onclick="selectDept('ai', 'الذكاء الاصطناعي', this)">
            <i class="fas fa-brain"></i>
            <h3>الذكاء الاصطناعي (AI)</h3>
        </div>
    </div>

    <!-- 2. قائمة المواد -->
    <div class="subjects-section" id="subjectsSection">
        <h3 class="section-title" id="selectedDeptTitle">المواد الدراسية</h3>
        
        <div class="subjects-grid">
            <!-- مادة الالكترونيات -->
            <div class="subject-card" onclick="selectSubject('الكترونيات', 'electronics', this)">
                <h4>الكترونيات</h4>
                <div class="bg-icon"><i class="fas fa-microchip"></i></div>
            </div>

            <!-- مادة مقدمة في علوم الحاسب -->
            <div class="subject-card" onclick="selectSubject('مقدمة في علوم الحاسب', 'cs_intro', this)">
                <h4>مقدمة في علوم الحاسب</h4>
                <div class="bg-icon"><i class="fas fa-desktop"></i></div>
            </div>

            <!-- مادة تفاضل وتكامل -->
            <div class="subject-card" onclick="selectSubject('تفاضل وتكامل', 'calculus', this)">
                <h4>تفاضل وتكامل</h4>
                <div class="bg-icon"><i>x</i></div>
            </div>

            <!-- مادة رياضة غير متصلة -->
            <div class="subject-card" onclick="selectSubject('رياضة غير متصلة', 'discrete_math', this)">
                <h4>رياضة غير متصلة</h4>
                <div class="bg-icon"><i>&pi;</i></div>
            </div>
        </div>

        <!-- 3. مكان رفع واستعراض الملفات لكل مادة -->
        <div class="files-section" id="filesSection">
            <div class="files-header">
                <h3 id="selectedSubjectTitle"><i class="fas fa-folder-open"></i> الملفات المتاحة</h3>
            </div>

            <!-- صندوق الرفع -->
            <div class="upload-box">
                <i class="fas fa-cloud-upload-alt" style="font-size: 2.5rem; color: var(--text-sub); margin-bottom: 10px;"></i>
                <p>إضافة ملف جديد لطلاب مادة <span id="uploadSubjectName" style="color: #38bdf8; font-weight: bold;"></span></p>
                <label for="fileInput" class="upload-btn">اختر الملف من جهازك</label>
                <input type="file" id="fileInput" onchange="uploadFile(this)">
            </div>

            <!-- قائمة الملفات المرفوعة -->
            <div class="files-list" id="filesList">
                <!-- يتم توليد الملفات هنا عبر JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // إعداد بيانات الملفات المخزنة افتراضياً لكل مادة
        const filesData = {
            'electronics': [
                { name: 'المحاضرة الأولى - العناصر الإلكترونية.pdf', size: '2.4 MB' },
                { name: 'شيت المحاكاة والتمارين.pdf', size: '1.1 MB' }
            ],
            'cs_intro': [
                { name: 'أساسيات البرمجة والخوارزميات.pdf', size: '3.8 MB' }
            ],
            'calculus': [
                { name: 'ملخص قواعد التفاضل والتكامل.pdf', size: '1.9 MB' }
            ],
            'discrete_math': [
                { name: 'مقدمة في نظرية المجموعات (Set Theory).pdf', size: '2.0 MB' }
            ]
        };

        let currentSubjectKey = '';

        // اختيار الشعبة
        function selectDept(deptKey, deptName, element) {
            document.querySelectorAll('.dept-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            const subjectsSection = document.getElementById('subjectsSection');
            const title = document.getElementById('selectedDeptTitle');
            title.innerText = 'المواد الدراسية لـ شعبة ' + deptName;
            
            // تغيير لون حافة العنوان حسب الشعبة
            if(deptKey === 'cs') title.style.borderColor = 'var(--cs-color)';
            if(deptKey === 'cyber') title.style.borderColor = 'var(--cyber-color)';
            if(deptKey === 'ai') title.style.borderColor = 'var(--ai-color)';

            subjectsSection.style.display = 'block';
            document.getElementById('filesSection').style.display = 'none';
            document.querySelectorAll('.subject-card').forEach(card => card.classList.remove('active'));
        }

        // اختيار المادة
        function selectSubject(subjectName, subjectKey, element) {
            document.querySelectorAll('.subject-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');

            currentSubjectKey = subjectKey;
            document.getElementById('selectedSubjectTitle').innerHTML = `<i class="fas fa-folder-open"></i> ملفات مادة: ${subjectName}`;
            document.getElementById('uploadSubjectName').innerText = subjectName;

            renderFiles(subjectKey);
            document.getElementById('filesSection').style.display = 'block';
        }

        // عرض الملفات
        function renderFiles(subjectKey) {
            const listContainer = document.getElementById('filesList');
            listContainer.innerHTML = '';

            const files = filesData[subjectKey] || [];

            if (files.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color: var(--text-sub);">لا توجد ملفات مرفوعة لهذه المادة حتى الآن.</p>';
                return;
            }

            files.forEach(file => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-info">
                        <i class="fas fa-file-pdf"></i>
                        <div>
                            <strong>${file.name}</strong>
                            <div style="font-size: 0.8rem; color: var(--text-sub);">${file.size}</div>
                        </div>
                    </div>
                    <div class="file-actions">
                        <a href="#" onclick="alert('جاري تحميل الملف...')"><i class="fas fa-download"></i> تحميل</a>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        // إمكانية إضافة ملف جديد من جهازك
        function uploadFile(input) {
            if (input.files && input.files[0] && currentSubjectKey) {
                const file = input.files[0];
                const fileSize = (file.size / (1024 * 1024)).toFixed(1) + ' MB';

                if (!filesData[currentSubjectKey]) {
                    filesData[currentSubjectKey] = [];
                }

                filesData[currentSubjectKey].push({
                    name: file.name,
                    size: fileSize
                });

                renderFiles(currentSubjectKey);
                alert('تمت إضافة الملف بنجاح إلى المادة!');
                input.value = '';
            }
        }
    </script>
</body>
</html>
